# Workspace-to-monitor assignments
# Odd workspaces on DP-3 (primary), even on HDMI-A-1 (secondary)

workspace = 1, monitor:DP-3, default:true, persistent:true
workspace = 2, monitor:DP-3, persistent:true
workspace = 3, monitor:HDMI-A-1, default:true, persistent:true
workspace = 4, monitor:HDMI-A-1, persistent:true
