# Environment variables (PRIME offload — Intel iGPU is primary)

# ── Electron ──────────────────────────────────────────────────────
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ── GTK theming ───────────────────────────────────────────────────
env = GTK_THEME,Gruvbox-Material-Dark

# ── Default terminal ─────────────────────────────────────────────
env = TERMINAL,kitty

# ── HiDPI scaling ────────────────────────────────────────────────
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# ── Cursor size (32 logical × 1.5 scale = 48 physical) ──────────
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
