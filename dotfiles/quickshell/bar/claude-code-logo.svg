<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Claude Code spark/asterisk logo -->
  <g transform="translate(32,32)">
    <!-- Six rounded petals radiating from center -->
    <rect x="-3.5" y="-28" width="7" height="24" rx="3.5" fill="#D97757" transform="rotate(0)"/>
    <rect x="-3.5" y="-28" width="7" height="24" rx="3.5" fill="#D97757" transform="rotate(60)"/>
    <rect x="-3.5" y="-28" width="7" height="24" rx="3.5" fill="#D97757" transform="rotate(120)"/>
    <rect x="-3.5" y="-28" width="7" height="24" rx="3.5" fill="#D97757" transform="rotate(180)"/>
    <rect x="-3.5" y="-28" width="7" height="24" rx="3.5" fill="#D97757" transform="rotate(240)"/>
    <rect x="-3.5" y="-28" width="7" height="24" rx="3.5" fill="#D97757" transform="rotate(300)"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="6" fill="#D97757"/>
  </g>
</svg>
